name: 24/7 Cloud Live Stream (5h50m Chunks)

on:
  schedule:
    # 4 Chunks daily (5h 50m stream + 10m gap):
    # Chunk 1: Starts 10:15 PM IST (16:45 UTC) -> 5h 50m (ends 04:05 IST)
    - cron: '45 16 * * *'
    # Chunk 2: Starts 4:05 AM IST (22:35 UTC) -> 5h 50m (ends 09:55 IST)
    - cron: '35 22 * * *'
    # Chunk 3: Starts 10:05 AM IST (04:35 UTC) -> 5h 50m (ends 15:55 IST)
    - cron: '35 4 * * *'
    # Chunk 4: Starts 4:05 PM IST (10:35 UTC) -> 5h 50m (ends 21:55 IST)
    - cron: '35 10 * * *'

  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Stream duration in minutes (default 350 mins = 5h 50m)'
        required: true
        default: '350'

jobs:
  cloud_stream_chunk:
    name: GitHub-Hosted Cloud Stream Chunk (5h 50m)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg bash coreutils curl grep gawk

      - name: Set Script Permissions
        run: |
          chmod +x scripts/*.sh

      - name: Validate Playlist
        run: |
          bash scripts/validate-videos.sh

      - name: Execute Live Stream Chunk
        env:
          YOUTUBE_STREAM_URL: ${{ secrets.YOUTUBE_STREAM_URL }}
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          TEST_MODE: "true"
          INPUT_MINS: ${{ inputs.duration_minutes }}
          STREAM_PROFILE: "720p"
        run: |
          if [ -z "${YOUTUBE_STREAM_KEY}" ]; then
            echo "Error: YOUTUBE_STREAM_KEY secret is missing! Please configure it under GitHub Repository Secrets." >&2
            exit 1
          fi
          MINS="${INPUT_MINS:-350}"
          export TEST_DURATION=$((MINS * 60))
          echo "Starting GitHub-Hosted Stream Chunk (Duration: ${TEST_DURATION}s / ${MINS} mins)..."
          bash scripts/stream.sh
